<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IC Studios - Home</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      position: relative;
      z-index: 2; /* make sure header is above canvas */
    }

    .main-logo {
      width: 200px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .main-logo:hover {
      transform: scale(1.05);
    }

    /* Matrix canvas overlay */
    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;        /* behind header/content */
      pointer-events: none; /* allow clicks through */
    }
  </style>
</head>
<body>
  <header>
    <img src="images/ICStudios.png" class="main-logo" alt="IC Studios Logo">
    <h1>Welcome to IC Studios</h1>
    <p>Click the logo for a secret.</p>
  </header>

  <!-- Matrix Canvas -->
  <canvas id="matrixCanvas"></canvas>

  <script>
    const secretAudio = new Audio("games/overlock/secret.mp3"); // adjust path if needed
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");

    // Resize canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const letters = "01";
    const fontSize = 14;
    let columns = canvas.width / fontSize;
    let drops = Array(Math.floor(columns)).fill(1);

    let running = false;

    function draw() {
      // Clear canvas fully (no black fading)
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(0, 255, 0, 0.8)";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    function startMatrix() {
      if (!running) {
        setInterval(draw, 50);
        running = true;
      }
    }

    document.querySelector(".main-logo").addEventListener("click", () => {
      secretAudio.play().catch(err => console.log("Autoplay blocked:", err));
      startMatrix();
    });
  </script>
</body>
</html>
